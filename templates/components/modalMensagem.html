<div class="modal fade" id="modalMensagem" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header bg-success">
                <h5 class="modal-title text-light text-uppercase">
                    <i class="fa-brands fa-whatsapp"></i> Enviar mensagem
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="enviar-tab" data-bs-toggle="tab"
                            data-bs-target="#enviar-tab-pane" type="button" role="tab" aria-controls="enviar-tab-pane"
                            aria-selected="true">Enviar Mensagem</button>
                    </li>

                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="historico-tab" data-bs-toggle="tab"
                            data-bs-target="#historico-tab-pane" type="button" role="tab"
                            aria-controls="historico-tab-pane" aria-selected="false">Histórico</button>
                    </li>
                </ul>
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active border" id="enviar-tab-pane" role="tabpanel"
                        aria-labelledby="enviar-tab" tabindex="0">
                        <div class="d-flex flex-row mt-2 p-2">
                            <span class="text-uppercase"><b>Nome:</b> {{nomeAluno}}</span>
                            <span class="text-uppercase ms-4"><b>Telefone:</b> {{telefoneAluno}}</span>
                        </div>

                        <div class="d-flex flex-column p-2">
                            <textarea class="form-control mt-3" id="mensagem" v-model="mensagem" rows="4"
                                placeholder="Digite a mensagem..."
                                :class="{'is-invalid': textMessage.textMessage, 'is-valid': !textMessage.textMessage && mensagem}">
                            </textarea>

                            <div class="invalid-feedback">
                                A mensagem não pode estar vazia.
                            </div>

                            <button class="btn btn-success mt-2" @click="enviarMensagem(telefoneAluno, alunoId)">
                                <i class="fa-brands fa-whatsapp"></i> Enviar
                            </button>
                        </div>
                    </div>

                    <div class="tab-pane fade border" id="historico-tab-pane" role="tabpanel" aria-labelledby="historico-tab"
                        tabindex="0">

                        <div v-if="carregandoMensagens" class="text-center mt-2 p-2">
                            Carregando mensagens...
                        </div>

                        <ul v-else class="list-group mt-2 p-2">
                            <li v-for="msg in historico_mensagens" :key="msg.id" class="list-group-item">
                                <div>{{ msg.mensagem }}</div>
                                <small class="text-muted">{{ msg.datahora_envio }}</small>
                            </li>

                            <li v-if="historico_mensagens.length === 0" class="list-group-item text-center">
                                Nenhuma mensagem enviada.
                            </li>
                        </ul>
                    </div>
                </div>



            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Sair
                </button>
            </div>

        </div>
    </div>
</div>
